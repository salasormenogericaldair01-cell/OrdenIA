[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordenia"
version = "0.1.0"
description = "Organizador local de archivos con supervisión y movimientos aprobados"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["PySide6>=6.7,<7", "watchdog>=4,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
ordenia = "ordenia.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
