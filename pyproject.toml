[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordenia"
dynamic = ["version"]
description = "Organizador local de archivos con supervisión y movimientos aprobados"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["PySide6>=6.7,<7", "watchdog>=4,<7", "PyMuPDF>=1.24,<2", "python-docx>=1.1,<2", "openpyxl>=3.1,<4", "python-pptx>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
packaging = ["pyinstaller>=6.11,<7"]

[project.scripts]
ordenia = "ordenia.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "ordenia.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ollama: prueba opcional que requiere un servicio Ollama local"]
